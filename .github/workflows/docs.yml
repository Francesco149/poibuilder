name: Docs

on:
  push:
    branches: [master, main]
    paths:
      - "docs/site/**"
      - "project/addons/poibuilder/plugin.cfg"
      - "project/addons/poibuilder/editor/pb_actions.gd"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # enablement: true turns Pages on for the repository via the API on the
      # first run — without it the deploy failed with "Get Pages site failed
      # ... Not Found" when the repo had never enabled Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build the static site
        # Screenshots/clips under docs/site/assets/ are committed; --strict
        # fails the deploy on any missing image/clip/broken link instead of
        # publishing placeholder boxes.
        run: ./docs/site/build.sh --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/out
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
