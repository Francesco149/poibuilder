# Showcase video timeline — the whole film, as data.
#
#   ./showcase_video/build.sh --list      what this timeline contains
#   ./showcase_video/build.sh             bake + assemble + encode
#   ./showcase_video/build.sh --only a,b  re-cut two clips and rebuild
#
# Frames come from a rendered showcase session (project/showcase/sessions/*.gd),
# from an external file, or from a card Pillow draws. Every clip is one
# continuous piece of video; the timeline is cut here, not in an editor.
#
# Keys:
#   source = "session:shot"   recorded beat        file = "path.mp4"  footage
#   card   = { ... }          generated title/end  region = "viewport" etc.
#   at / dur / speed          trim, length, time scaling. A NEGATIVE `at`
#                             counts back from the shot's end (-2.4 = the last
#                             2.4 s) — beats are authored with their payoff last
#   zoom   = [z0, z1]         slow push-in over the clip
#   into   = [x, y, w, h]     where the picture lands in the output frame
#   crop   = [x, y, w, h]     explicit source crop (overrides `region`)
#   fit    = "cover"|"contain"  frame = "rounded"  fade_in / fade_out
#   captions = [{ label, text, sub, at, dur, pos }]

[project]
name = "poibuilder-showcase"
width = 1280
height = 720
fps = 60
readme_width = 960
out_dir = "out"
master = "poibuilder-showcase.mp4"
readme = "poibuilder-showcase-960.mp4"
poster = "poibuilder-showcase-poster.png"

# ===========================================================================
