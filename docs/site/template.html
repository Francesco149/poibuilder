<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — PoiBuilder {{version}}</title>
<meta name="description" content="{{lead}}">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="{{body_class}}">
<input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
<header class="top">
  <label for="nav-toggle" class="nav-btn" aria-label="Open navigation">☰</label>
  <a class="brand" href="index.html">
    <img src="favicon.svg" width="22" height="22" alt="">
    <span>PoiBuilder</span>
    <small>{{version}}</small>
  </a>
  <div class="top-breadcrumb">
    <span class="bc-sep">/</span>
    <span class="bc-section">{{section}}</span>
    <span class="bc-sep">/</span>
    <span class="bc-page">{{title}}</span>
  </div>
  <nav class="top-links">
    <a href="first-minutes.html">First minutes</a>
    <a href="keys.html">Keys</a>
    <a href="https://github.com/Francesco149/poibuilder">GitHub</a>
  </nav>
</header>
<div class="shell">
  <label for="nav-toggle" class="nav-scrim"></label>
  <aside class="side">
    <p class="side-kicker">Godot 4 mesh building</p>
    {{nav}}
  </aside>
  <main class="main">
    <article class="page">
      {{hero}}
      {{content}}
    </article>
    <nav class="pager">{{prev}}{{next}}</nav>
    <footer class="foot">
      Docs built for PoiBuilder {{version}}. Offline copy ships inside the addon.
      Keys are the compiled-in defaults — rebind in Editor Settings → Shortcuts.
    </footer>
  </main>
</div>
</body>
</html>
